name: 自动更新废品报价

# 定时抓取行情并更新 prices.json。
# 时区说明：GitHub Actions 的 cron 一律按 UTC 计算。
#   UTC 01:30 / 01:50 / 02:10 = 北京 09:30 / 09:50 / 10:10（上午报价）
#   UTC 07:30 / 07:50        = 北京 15:30 / 15:50（下午报价）
# GitHub 的定时任务会在高峰期延迟甚至丢弃，所以这里保留两组触发：
#   1) GitHub 内置 schedule：每时段 3 个 / 2 个触发点作为兜底；
#   2) 外部定时器调 workflow_dispatch 接口：时间由外部控制，不受 GitHub 延迟影响
#      （推荐 Cloudflare Workers，见 docs/EXTERNAL_SCHEDULER.md）。
# 两种触发方式都过同一个「判断是否已有新数据」幂等：最近 2 小时内更新过就跳过。
# 谁先跑都一样，不会重复抓；确需强制刷新时手动触发并勾选 force。
# 周一至周五运行（1-5），周末行情不更新。
on:
  schedule:
    - cron: '30 1 * * 1-5'
    - cron: '50 1 * * 1-5'
    - cron: '10 2 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '50 7 * * 1-5'
  # 外部定时器 / 手动触发。force=true 时忽略 2 小时幂等，强制抓一次。
  workflow_dispatch:
    inputs:
      force:
        description: '强制更新：忽略 2 小时幂等检查（日常定时不要勾选）'
        type: boolean
        required: false
        default: false

# 需要写权限才能把更新后的 prices.json 推回仓库
permissions:
  contents: write

# 同一时间只跑一个：定时触发偶尔会排队，两次运行撞在一起时
# 后一次 push 会因远端已更新而失败（non-fast-forward）。这里串行化。
concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 判断是否已有新数据
        id: fresh
        run: |
          SKIP=$(python3 - <<'PY'
          import json, datetime
          try:
              d = json.load(open('prices.json', encoding='utf-8'))
              t = datetime.datetime.fromisoformat(d['updatedAt'])
              n = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
              gap = (n - t).total_seconds()
              print('yes' if 0 <= gap < 7200 else 'no')
          except Exception:
              print('no')
          PY
          )
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "最近 2 小时内已更新: $SKIP"

      - name: 检查语法
        if: inputs.force == true || steps.fresh.outputs.skip != 'yes'
        run: python -m py_compile search_and_update.py update_prices.py forecast.py fetch_mysteel.py

      - name: 抓取并更新价格
        # 跳过脚本自带的 git push，由下面的步骤统一提交
        # 这一步的源是单点补充，境外 IP 偶发超时；失败不阻断后面更可靠的子站抓取
        if: inputs.force == true || steps.fresh.outputs.skip != 'yes'
        continue-on-error: true
        env:
          SKIP_GIT_PUSH: '1'
        run: python search_and_update.py

      - name: 补充废铜/废铝公开行情
        # Mysteel 子站首页的「今日价格」表：多地区报价，且自带涨跌。
        # 放在上一步之后，铜铝的主价格以这里的中位数为准（更稳，也带涨跌依据）。
        # 抓不到就跳过，不影响前面已更新的结果。
        if: inputs.force == true || steps.fresh.outputs.skip != 'yes'
        continue-on-error: true
        run: python fetch_mysteel.py

      - name: 核对走势预测信号
        # 抓取公开行情文本，与 forecast.json 里的判断做交叉验证；
        # 抓取失败会保留原判断，不会把预测改成中性。
        if: inputs.force == true || steps.fresh.outputs.skip != 'yes'
        continue-on-error: true
        run: python forecast.py

      - name: 有变化才提交
        if: inputs.force == true || steps.fresh.outputs.skip != 'yes'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if git diff --quiet -- prices.json forecast.json; then
            echo "价格与预测均无变化，跳过提交"
            exit 0
          fi

          # 竞态补偿：两次触发相隔几十秒时，开头幂等都判断为「旧」，会各自抓一遍。
          # 提交前先看远端是不是已经被别的运行更新过；是的话丢弃本地价格改动，
          # 以远端为准。价格快照不该被 rebase 合并，那只会制造冲突。
          git fetch origin main --quiet
          REMOTE_FRESH=$(git show origin/main:prices.json \
            | python3 -c "import sys,json,datetime;d=json.load(sys.stdin);t=datetime.datetime.fromisoformat(d['updatedAt']);n=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)));print('yes' if 0 <= (n-t).total_seconds() < 7200 else 'no')" \
            || echo no)
          if [ "$REMOTE_FRESH" = "yes" ] && [ "$FORCE" != "true" ]; then
            echo "远端 prices.json 已在 2 小时内更新，本次结果丢弃，避免重复提交"
            git checkout -- prices.json forecast.json
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json forecast.json
          NOW=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          git commit -m "[auto] 价格更新 $NOW"

          # 仍被拒说明期间有别人推送（如人工改代码）。价格文件以远端为准，
          # 本地这份自动提交直接丢弃，不当成失败；下次运行会重新抓。
          if ! git push; then
            echo "push 被拒，存在并发提交；丢弃本次自动提交，以远端为准"
            git reset --hard origin/main
          fi
