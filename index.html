<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="回收报价">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>废品回收报价助手</title>
<style>
/* ===== 现代精致设计系统 ===== */
:root{
  --primary:#6366f1; --primary-dark:#4f46e5; --primary-deep:#4338ca;
  --primary-light:#eef2ff; --success:#10b981; --warning:#f59e0b;
  --up:#ef4444; --down:#10b981;
  --bg:#f1f5f9; --card:#fff; --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --border:#e2e8f0;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --shadow-hover:0 6px 12px rgba(15,23,42,.08),0 12px 28px rgba(15,23,42,.10);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding:20px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
.container{max-width:1100px;margin:0 auto}

/* 品牌头部 */
.header{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#4f46e5 0%,#6366f1 55%,#7c3aed 100%);
  border-radius:18px;padding:26px 30px;margin-bottom:20px;color:#fff;
  box-shadow:0 8px 24px rgba(79,70,229,.28);
}
.header::after{content:'';position:absolute;right:-30px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09)}
.header::before{content:'';position:absolute;right:110px;bottom:-100px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.header h1{font-size:1.8rem;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.header .logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-style:normal}
.header .sub{font-size:.86rem;opacity:.85;margin-top:8px;position:relative;z-index:1}

/* 数据概览：折叠条 + 卡片 */
.stat-panel{margin-bottom:18px}
.stat-bar{display:flex;align-items:center;gap:10px;width:100%;padding:11px 15px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;color:var(--text);text-align:left;transition:border-color .15s,box-shadow .15s}
.stat-bar:hover{border-color:#c7d2fe}
.sb-title{font-size:.82rem;font-weight:700;color:var(--text-2);flex:0 1 auto;min-width:0;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sb-sum{flex:1 1 0;min-width:0;text-align:right;font-size:.76rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sum i{font-style:normal;color:var(--primary-dark);font-weight:700}
.sb-hint{display:none;margin-left:auto;font-size:.72rem;color:var(--text-3);flex-shrink:0}
.stat-panel.open .sb-hint{display:inline}
.sb-arrow{color:var(--text-3);font-size:.72rem;line-height:1;transition:transform .22s;flex-shrink:0}
.stat-panel.open .sb-arrow{transform:rotate(180deg)}
.stat-panel.open .sb-sum{display:none}
.stats{display:none;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:11px}
.stat-panel.open .stats{display:grid}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.stat-card.stat-click{cursor:pointer}
.stat-card.stat-click:hover{border-color:#c7d2fe}
.sc-body{min-width:0;flex:1}
.sc-body .num{display:flex;align-items:baseline;gap:3px}
.sc-body .num em{font-style:normal;font-size:.74rem;font-weight:600;color:var(--text-3);margin-left:2px}
.sc-body .label{font-size:.74rem;color:var(--text-3);margin-top:3px;display:flex;align-items:center;gap:5px}
.sc-body .label b{color:var(--text-2);font-weight:700}
.sc-go{color:#c7d2fe;font-size:1.2rem;line-height:1;flex-shrink:0}
.stat-icon{width:46px;height:46px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-style:normal}
.stat-card:nth-child(1) .stat-icon{background:#eef2ff}
.stat-card:nth-child(2) .stat-icon{background:#ecfdf5}
.stat-card:nth-child(3) .stat-icon{background:#fffbeb}
.stat-card:nth-child(4) .stat-icon{background:#ecfeff}
.stat-card .num{font-size:1.55rem;font-weight:800;line-height:1.2}
.stat-card .label{font-size:.76rem;color:var(--text-3);margin-top:2px}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card-title{font-size:1.08rem;font-weight:700;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid var(--primary-light);display:flex;justify-content:space-between;align-items:center}
.card-title .time{font-size:.75rem;color:var(--text-3);font-weight:400}

/* 按钮 */
.btn{padding:9px 18px;border:none;border-radius:9px;cursor:pointer;font-size:.86rem;font-weight:600;color:#fff;display:inline-flex;align-items:center;gap:6px;transition:transform .15s,box-shadow .15s,filter .15s;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5)}
.btn-success{background:linear-gradient(135deg,#10b981,#059669)}
.btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706)}
.btn-info{background:linear-gradient(135deg,#06b6d4,#0891b2)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn-sm{padding:6px 12px;font-size:.78rem;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}

/* 表单 */
select,input[type=number],input[type=text]{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.9rem;outline:none;background:#fff;color:var(--text);transition:border-color .2s,box-shadow .2s}
select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
label{font-size:.82rem;color:var(--text-2);margin-bottom:6px;display:block;font-weight:600}
.form-row{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
.form-group{display:flex;flex-direction:column;flex:1;min-width:120px}

/* 结果框 */
.result-box{background:linear-gradient(135deg,#eef2ff,#eff6ff);border:1px solid #c7d2fe;border-radius:12px;padding:20px;margin-top:14px;text-align:center}
.result-box .price{font-size:2.2rem;font-weight:800;background:linear-gradient(135deg,#4f46e5,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.result-box .detail{font-size:.85rem;color:var(--text-2);margin-top:6px}

/* 推荐收货价 */
.rec-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 9px;margin-bottom:10px;scrollbar-width:none;-ms-overflow-style:none}
.rec-tabs::-webkit-scrollbar{display:none}
.rec-tab{flex:0 0 auto;padding:7px 15px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--text-2);font-size:.84rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.rec-tab:hover{border-color:#c7d2fe;color:var(--primary-deep)}
.rec-tab.active{background:linear-gradient(135deg,#6366f1,#4f46e5);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.28)}
.rec-card{background:linear-gradient(180deg,#fbfcff,#f7f9fd);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:4px 16px 6px;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.rec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:11px 0 9px;border-bottom:1px dashed #dbe3ee;margin-bottom:2px}
.rec-head .rec-cat{font-weight:800;font-size:.96rem;color:var(--primary-deep)}
.rec-head .rec-count{font-size:.72rem;color:var(--text-3)}
.ratio-chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 11px}
.ratio-chip{padding:6px 13px;border:1px solid var(--border);background:#fff;border-radius:999px;font-size:.79rem;font-weight:600;color:var(--text-2);cursor:pointer;font-family:inherit;transition:background .15s,color .15s,border-color .15s,box-shadow .15s}
.ratio-chip:hover{border-color:#c7d2fe;color:var(--primary-deep)}
.ratio-chip.active{background:linear-gradient(135deg,#6366f1,#4f46e5);border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.26)}
.stat-card .num.pop{animation:numPop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes numPop{0%{transform:scale(1);color:var(--text)}45%{transform:scale(1.28);color:var(--primary-dark)}100%{transform:scale(1);color:var(--text)}}
.rec-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px}
.rec-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed #e8eef6}
.rec-row:last-child{border-bottom:none}
.rec-name{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rec-name .item-link{font-size:.9rem;border-bottom:none;align-self:flex-start;line-height:1.3}
.rec-name i{font-style:normal;font-size:.7rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.rec-num{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;line-height:1.2;font-variant-numeric:tabular-nums}
.rec-num b{font-size:1.08rem;color:var(--primary-dark)}
.rec-num em{font-style:normal;font-size:.67rem;color:var(--text-3);margin-top:2px}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:var(--primary-light);padding:12px 10px;text-align:left;font-weight:700;color:var(--primary-deep);position:sticky;top:0;border-bottom:2px solid #c7d2fe}
td{padding:10px;border-bottom:1px solid var(--border);color:var(--text-2)}
tr:hover td{background:#f8fafc}
.up{color:var(--up);font-weight:700}
.down{color:var(--down);font-weight:700}
.flat{color:var(--text-3)}
.search-box{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:9px;margin-bottom:14px;font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.table-wrap{max-height:420px;overflow-y:auto;border-radius:10px;border:1px solid var(--border)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:700}
.tag-up{background:#fef2f2;color:var(--up)}
.tag-down{background:#ecfdf5;color:var(--down)}

/* 弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:18px;padding:26px;width:90%;max-width:500px;max-height:82vh;overflow-y:auto;box-shadow:0 24px 60px rgba(15,23,42,.3);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal h3{margin-bottom:16px;color:var(--text);font-size:1.2rem}
.modal textarea{width:100%;height:200px;padding:12px;border:1.5px solid var(--border);border-radius:10px;font-size:.86rem;resize:vertical;font-family:inherit;outline:none}
.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.modal .btn-group{margin-top:16px;justify-content:flex-end}
.toast{position:fixed;top:24px;right:24px;background:var(--text);color:#fff;padding:13px 22px;border-radius:10px;font-size:.9rem;z-index:200;opacity:0;transform:translateY(-10px);transition:opacity .3s,transform .3s;pointer-events:none;box-shadow:0 8px 24px rgba(15,23,42,.3)}
.toast.show{opacity:1;transform:none}

/* 品类详情 */
.item-link{color:var(--primary-deep);cursor:pointer;font-weight:600;border-bottom:1px dashed #a5b4fc;transition:color .15s}
.item-link:hover{color:var(--primary);background:#eef2ff}
.info-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-size:.68rem;font-weight:700;margin-left:5px;cursor:pointer;flex-shrink:0}
.info-badge:hover{background:var(--primary);color:#fff}
.info-modal{max-width:560px}
.info-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:2px solid var(--primary-light);margin-bottom:16px}
.info-head .ih-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-style:normal;flex-shrink:0}
.info-head .ih-cat{font-size:.76rem;color:var(--primary);font-weight:700}
.info-head .ih-name{font-size:1.3rem;font-weight:800;color:var(--text)}
.info-head .ih-price{margin-left:auto;text-align:right}
.info-head .ih-price b{font-size:1.5rem;color:var(--up)}
.info-head .ih-price span{font-size:.7rem;color:var(--text-3);display:block}
.info-sec{margin-bottom:16px}
.info-sec .sec-t{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.info-sec .sec-t::before{content:'';width:4px;height:15px;border-radius:2px;background:var(--primary)}
.info-sec.intro p{font-size:.86rem;color:var(--text-2);line-height:1.7;margin:0;padding:11px 13px;background:#f8fafc;border-radius:9px;border:1px solid var(--border)}
.how-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.how-list li{font-size:.84rem;color:var(--text-2);line-height:1.5;padding-left:26px;position:relative}
.how-list li::before{content:counter(how);counter-increment:how;position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:6px;background:var(--primary-light);color:var(--primary);font-size:.7rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.how-list{counter-reset:how}
.info-tip{font-size:.82rem;color:#92400e;line-height:1.6;padding:11px 13px;background:#fffbeb;border:1px solid #fde68a;border-radius:9px}

/* 品类总览 */
.ov-modal{max-width:620px}
.ov-head{display:flex;align-items:flex-start;gap:12px;padding-bottom:13px;border-bottom:2px solid var(--primary-light);margin-bottom:13px}
.ov-head .ov-title{font-size:1.1rem;font-weight:800;color:var(--text)}
.ov-head .ov-sub{font-size:.76rem;color:var(--text-3);margin-top:3px;line-height:1.5}
.ov-close{margin-left:auto;width:30px;height:30px;flex-shrink:0;border:none;border-radius:50%;background:#f1f5f9;color:var(--text-3);font-size:.9rem;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.ov-close:hover{background:var(--primary-light);color:var(--primary)}
.ov-tabs{display:flex;gap:7px;overflow-x:auto;padding:0 0 11px;scrollbar-width:none;-ms-overflow-style:none}
.ov-tabs::-webkit-scrollbar{display:none}
.ov-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ov-item{display:flex;align-items:center;gap:8px;width:100%;padding:11px 12px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:inherit;text-align:left;transition:background .15s,border-color .15s,transform .15s}
.ov-item:hover{background:var(--primary-light);border-color:#c7d2fe;transform:translateY(-1px)}
.ov-i-name{font-size:.87rem;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-i-price{font-size:.85rem;font-weight:700;color:var(--primary-dark);font-variant-numeric:tabular-nums;flex-shrink:0}
.ov-i-price em{font-style:normal;font-size:.62rem;color:var(--text-3);font-weight:400;margin-left:1px}
.ov-i-go{color:#c7d2fe;font-size:1rem;line-height:1;flex-shrink:0}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* ===================== 手机端专门适配 ===================== */
@media(max-width:720px){
  body{padding:calc(10px + env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom))}
  .container{max-width:100%}

  /* 头部 */
  .header{border-radius:14px;padding:17px 16px;margin-bottom:13px}
  .header h1{font-size:1.14rem;gap:9px;line-height:1.35}
  .header .logo{width:34px;height:34px;border-radius:9px;font-size:1.12rem}
  .header .sub{font-size:.73rem;margin-top:5px;line-height:1.5}

  /* 数据概览：折叠条 */
  .stat-panel{margin-bottom:12px}
  .stat-bar{padding:10px 13px;border-radius:11px;gap:8px}
  .sb-title{font-size:.79rem}
  .sb-sum{font-size:.71rem}

  /* 统计卡：两列，数字不换行 */
  .stats{grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .stat-card{padding:11px 10px;gap:8px;border-radius:12px}
  .stat-card:hover{transform:none;box-shadow:var(--shadow)}
  .stat-icon{width:34px;height:34px;font-size:.98rem;border-radius:9px}
  .stat-card .num{font-size:1.02rem;white-space:nowrap}
  .sc-body .label{font-size:.64rem;margin-top:2px;gap:3px}
  .sc-body .num em{font-size:.66rem}
  .sc-go{display:none}

  /* 品类总览：单列 */
  .ov-modal{max-width:100%}
  .ov-body{grid-template-columns:1fr;gap:7px}
  .ov-item{padding:12px 13px;min-height:44px}
  .ov-i-name{font-size:.9rem}
  .ov-i-price{font-size:.9rem}
  .ov-tabs{gap:6px}

  /* 卡片 */
  .card{padding:14px 13px;border-radius:13px;margin-bottom:12px}
  .card-title{font-size:.98rem;margin-bottom:12px;padding-bottom:9px;flex-wrap:wrap;gap:3px}
  .card-title .time{font-size:.67rem;width:100%}

  /* 按钮：触控≥44px */
  .btn{min-height:44px;padding:11px 15px;font-size:.9rem;justify-content:center}
  .btn-sm{min-height:38px;padding:9px 13px;font-size:.8rem}
  .btn-group{gap:8px}
  .btn-group .btn{flex:1 1 auto}

  /* 表单：全宽 + 16px 防 iOS 聚焦缩放 */
  .form-row{flex-direction:column;gap:10px;align-items:stretch;margin-bottom:10px}
  .form-group{min-width:0;width:100%!important;max-width:none!important}
  select,input[type=number],input[type=text],.search-box,.modal textarea{font-size:16px;padding:12px 13px;width:100%}
  .search-box{margin-bottom:10px}
  .form-group .btn{width:100%}
  label{font-size:.8rem;margin-bottom:5px}

  /* 结果框 */
  .result-box{padding:15px;margin-top:12px}
  .result-box .price{font-size:1.85rem}
  .result-box .detail{font-size:.79rem;line-height:1.5}

  /* 推荐收货价：大类切换 + 单卡列表 */
  .rec-tabs{gap:7px;margin:0 -3px 10px;padding:0 3px 8px}
  .rec-tab{padding:8px 15px;font-size:.83rem}
  .rec-card{padding:2px 13px 4px;border-radius:12px}
  .rec-list{grid-template-columns:1fr;column-gap:0}
  .ratio-chips{gap:5px;margin-bottom:10px}
  .ratio-chip{padding:7px 11px;font-size:.79rem}
  .rec-head{padding:10px 0 8px}
  .rec-row{padding:11px 0;gap:10px}
  .rec-name .item-link{font-size:.92rem}
  .rec-name i{font-size:.68rem}
  .rec-num b{font-size:1.1rem}

  /* ===== 表格转卡片 ===== */
  .table-wrap{max-height:none;border:none;overflow:visible;border-radius:0}
  table{font-size:.9rem}
  thead{display:none}
  tbody{display:block}
  tbody tr{display:block;background:#fff;border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
  tbody tr:hover td{background:transparent}
  tbody td{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #eef2f7;font-size:.9rem;text-align:right;color:var(--text)}
  tbody td:last-child{border-bottom:none;padding-top:9px}
  tbody td::before{content:attr(data-label);color:var(--text-3);font-size:.76rem;font-weight:600;flex-shrink:0;text-align:left}
  /* 品类作标题行 */
  tbody td[data-label="品类"]{font-size:1.02rem;font-weight:700;border-bottom:1px solid var(--border);padding-bottom:9px;margin-bottom:2px;justify-content:space-between}
  tbody td[data-label="品类"] .item-link{font-size:1.02rem;border-bottom:none}
  /* 单价突出 */
  tbody td[data-label="单价(元/kg)"] b{font-size:1.1rem;color:var(--primary-deep)}
  /* 详情按钮整行 */
  tbody td[data-label="详情"]::before{display:none}
  tbody td[data-label="详情"] .btn{width:100%;justify-content:center}
  /* 空状态 */
  tbody tr.empty-row td{justify-content:center;text-align:center;border:none;color:var(--text-3)}
  tbody tr.empty-row td::before{display:none}

  /* ===== 弹窗改底部抽屉 ===== */
  .modal-overlay{padding:0;align-items:flex-end}
  .modal{width:100%;max-width:100%;max-height:88vh;border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));animation:slideUp .26s ease-out}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .info-modal{max-width:100%}
  .info-head{gap:10px;padding-bottom:12px;margin-bottom:14px}
  .info-head .ih-icon{width:40px;height:40px;font-size:1.12rem;border-radius:10px}
  .info-head .ih-cat{font-size:.73rem}
  .info-head .ih-name{font-size:1.08rem;line-height:1.35}
  .info-head .ih-price b{font-size:1.22rem}
  .info-sec{margin-bottom:14px}
  .info-sec .sec-t{font-size:.85rem;margin-bottom:7px}
  .info-sec.intro p{font-size:.85rem;padding:10px 12px;line-height:1.65}
  .how-list li{font-size:.85rem}
  .info-tip{font-size:.82rem;padding:10px 12px}
  .modal h3{font-size:1.05rem}
  .modal .btn-group{margin-top:14px}
  .modal .btn-group .btn{flex:1}

  /* toast 顶部通栏 */
  .toast{top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;padding:12px 16px;text-align:center;font-size:.87rem;transform:translateY(-14px)}
  .toast.show{transform:none}
}

/* 超小屏微调 */
@media(max-width:360px){
  .header h1{font-size:1.02rem}
  .stat-card .num{font-size:.92rem}
  .stat-icon{display:none}
  .stat-card{justify-content:center}
}

<body>
<div class="container">
  <div class="header">
    <h1><span class="logo">♻</span>废品回收报价助手</h1>
    <div class="sub">快速查询 · 实时行情 · 品类详情 · 价格估算</div>
  </div>

  <!-- 数据概览：默认折叠，点标题展开 -->
  <div class="stat-panel" id="statPanel">
    <button class="stat-bar" type="button" onclick="toggleStats()" id="statBar" aria-expanded="false">
      <span class="sb-title">📊 数据概览</span>
      <span class="sb-sum" id="sbSum">—</span>
      <span class="sb-hint">收起</span>
      <span class="sb-arrow">▼</span>
    </button>
    <div class="stats">
      <div class="stat-card stat-click" onclick="openOverview()" title="查看全部大类与品类">
        <div class="stat-icon">📦</div>
        <div class="sc-body">
          <div class="num"><span id="statCats">0</span><em>大类</em><span id="statItems" style="margin-left:6px">0</span><em>品类</em></div>
          <div class="label">点此查看全部品类 →</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👀</div>
        <div class="sc-body">
          <div class="num"><span id="statToday">—</span><em>今日浏览</em></div>
          <div class="label">累计 <b id="statTotal">—</b></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 计算区 -->
  <div class="card">
    <div class="card-title">价格计算</div>
    <div class="form-row">
      <div class="form-group">
        <label>大类</label>
        <select id="selCat" onchange="loadItems()"><option value="">选择大类</option></select>
      </div>
      <div class="form-group">
        <label>品类</label>
        <select id="selItem"><option value="">选择品类</option></select>
      </div>
      <div class="form-group" style="max-width:140px">
        <label>重量 (公斤)</label>
        <input type="number" id="inputWeight" placeholder="0" min="0" step="0.1">
      </div>
      <div class="form-group" style="max-width:100px">
        <label>&nbsp;</label>
        <button class="btn btn-primary" onclick="calcPrice()">计算</button>
      </div>
    </div>
    <div class="result-box" id="resultBox" style="display:none">
      <div class="price" id="resultPrice">¥0.00</div>
      <div class="detail" id="resultDetail"></div>
    </div>
  </div>

  <!-- 推荐收货价格 -->
  <div class="card">
    <div class="card-title">推荐收货价格 <span class="time" id="recTimeLabel"></span></div>
    <div class="rec-tabs" id="recTabs"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap">
      <span style="font-size:.85rem;font-weight:600;white-space:nowrap">收货比例</span>
      <input type="range" id="recRatio" min="50" max="120" value="100" step="1" oninput="onRatioChange()" style="flex:1;min-width:150px;accent-color:#6366f1">
      <span id="recRatioLabel" style="font-size:.9rem;font-weight:700;color:#4f46e5;min-width:45px;text-align:right">100%</span>
    </div>
    <div class="ratio-chips" id="ratioChips"></div>
    <p style="font-size:.8rem;color:#94a3b8;margin-bottom:12px">点选常用比例，或拖动滑杆自定义（50%–120%）</p>
    <div id="recGrid"></div>
  </div>

  <!-- 导出 -->
  <div class="card">
    <div class="card-title">导出数据</div>
    <div class="btn-group">
      <button class="btn btn-info" onclick="exportCSV()">导出CSV</button>
      <button class="btn btn-info" onclick="exportExcel()">导出Excel</button>
    </div>
  </div>

  <!-- 价格总览 -->
  <div class="card">
    <div class="card-title">价格总览<span class="time" id="updateTimeLabel"></span></div>
    <input type="text" class="search-box" id="searchBox" placeholder="搜索品类名称..." oninput="renderTable()">
    <div class="table-wrap">
      <table>
        <thead><tr><th>大类</th><th>品类</th><th>单价(元/kg)</th><th>上次价格</th><th>涨跌</th><th>详情</th></tr></thead>
        <tbody id="priceBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 品类总览弹窗 -->
<div class="modal-overlay" id="ovModal">
  <div class="modal ov-modal">
    <div class="ov-head">
      <div>
        <div class="ov-title">全部品类</div>
        <div class="ov-sub" id="ovSub"></div>
      </div>
      <button class="ov-close" type="button" onclick="closeOverview()" aria-label="关闭">✕</button>
    </div>
    <div class="ov-tabs" id="ovTabs"></div>
    <div class="ov-body" id="ovBody"></div>
  </div>
</div>

<!-- 品类详情弹窗 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal info-modal">
    <div class="info-head">
      <div class="ih-icon" id="infoIcon">♻</div>
      <div><div class="ih-cat" id="infoCat"></div><div class="ih-name" id="infoName"></div></div>
      <div class="ih-price"><b id="infoPrice"></b><span>元/公斤</span></div>
    </div>
    <div class="info-sec intro">
      <div class="sec-t">品类介绍</div>
      <p id="infoIntro"></p>
    </div>
    <div class="info-sec">
      <div class="sec-t">分辨方法</div>
      <ol class="how-list" id="infoHow"></ol>
    </div>
    <div class="info-sec">
      <div class="sec-t">收货提示</div>
      <div class="info-tip" id="infoTip"></div>
    </div>
    <div class="btn-group" style="justify-content:flex-end;margin-top:18px">
      <button class="btn btn-primary btn-sm" onclick="closeItemInfo()">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========== 品类知识库：介绍 / 分辨方法 / 收货提示 ==========

const DEFAULT_DATA = {};
for (const [cat, items] of Object.entries(REC_PRICES)) {

// ========== 状态 ==========
let priceData = {};     // { category: { item: price } }
let lastPrices = {};    // 上次价格快照
let updateTime = null;
const RATIO_PRESETS = [70, 80, 85, 90, 95, 100];
let recRatio = 85;      // 收货比例，默认85%
let recCat = '';        // 推荐收货价当前显示的大类

// ========== 存储（浏览器禁用/无痕模式下 localStorage 可能抛异常） ==========
function storeGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function storeSet(k, v) {
  try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
}

// ========== 从 prices.json 拉取远程价格 ==========
// 统一时间显示：2026-11-20T17:38:25+08:00 → 2026-11-20 17:38
function fmtTime(s) {
  if (!s) return '';
  const t = String(s).replace('T', ' ');
  return t.length >= 16 ? t.slice(0, 16) : t;
}

async function fetchPrices() {
  const toastEl = document.getElementById('toast');
  if (toastEl) {
    toastEl.textContent = '🔄 同步中...';
    toastEl.classList.add('show');
  }
  try {
    const resp = await fetch('prices.json?t=' + Date.now());
    const data = await resp.json();
    // 先快照当前价格到 lastPrices（做对比用）
    for (const [cat, items] of Object.entries(data.categories)) {
      if (!priceData[cat]) continue;
      if (!lastPrices[cat]) lastPrices[cat] = {};
      for (const item of Object.keys(items)) {
        // 只在第一次获取或价格变化时记录上次价格
        if (priceData[cat][item] !== undefined && priceData[cat][item] !== items[item]) {
          if (lastPrices[cat][item] === undefined) {
            lastPrices[cat][item] = priceData[cat][item];
          }
        }
      }
    }
    // 合并新价格到 priceData
    for (const [cat, items] of Object.entries(data.categories)) {
      if (!priceData[cat]) priceData[cat] = {};
      for (const [item, price] of Object.entries(items)) {
        // 价格变了才更新 lastPrices
        if (priceData[cat][item] !== undefined && priceData[cat][item] !== price) {
          lastPrices[cat] = lastPrices[cat] || {};
          lastPrices[cat][item] = priceData[cat][item];
        }
        priceData[cat][item] = price;
      }
    }
    // 更新 updateTime 为服务器时间
    updateTime = data.updatedAt || new Date().toLocaleString('zh-CN');
    document.getElementById('updateTimeLabel').textContent = '更新于 ' + fmtTime(updateTime);
    if (toastEl) {
      toastEl.textContent = '✅ 已同步';
      setTimeout(() => toastEl.classList.remove('show'), 1500);
    }
    // 保存到 localStorage
    save();
    // 数据已更新，立即重绘界面（否则表格和推荐价要等手动刷新才变）
    const selCat = document.getElementById('selCat');
    if (selCat && selCat.options.length !== Object.keys(priceData).length + 1) renderCatSelect();
    renderRecTabs();
    renderRecGrid();
    renderTable();
    updateStats();
    return true;
  } catch(e) {
    if (toastEl) {
      toastEl.textContent = '使用本地数据';
      setTimeout(() => toastEl.classList.remove('show'), 1500);
    }
    return false;
  }
}

// ========== 初始化 ==========
async function init() {
  const saved = storeGet('scrap_prices');
  const savedLast = storeGet('scrap_last_prices');
  const savedTime = storeGet('scrap_update_time');

  if (saved) {
    priceData = JSON.parse(saved);
  } else {
    priceData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  lastPrices = savedLast ? JSON.parse(savedLast) : {};
  updateTime = savedTime || null;
  recRatio = parseInt(storeGet('scrap_rec_ratio_v2') || '100');
  recCat = storeGet('scrap_rec_cat') || '';
  document.getElementById('recRatio').value = recRatio;
  document.getElementById('recRatioLabel').textContent = recRatio + '%';
  renderRatioChips();

  // 从远程拉取价格（失败时使用本地兜底）
  await fetchPrices();

  renderCatSelect();
  renderTable();
  renderRecTabs();
  renderRecGrid();
  updateStats();

  // 数据概览默认折叠，记住上次状态
  toggleStats(storeGet('scrap_stats_open') === '1');

  // 点弹窗外遮罩关闭
  document.getElementById('ovModal').addEventListener('click', function(e) {
    if (e.target === this) closeOverview();
  });
  document.getElementById('infoModal').addEventListener('click', function(e) {
    if (e.target === this) closeItemInfo();
  });

  // 浏览量统计（异步，不阻塞页面）
  loadViews();

  // 每小时重新拉一次浏览量（loadViews 内部按 1 小时窗口自行节流，刷新不会重复计数）
  setInterval(loadViews, 60 * 60 * 1000);
  // 页面从后台切回前台时也检查一次，避免手机挂后台定时器被暂停
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') loadViews();
  });

  // 每5分钟自动刷新价格
  setInterval(fetchPrices, 5 * 60 * 1000);
}

// 大类切换标签
function renderRecTabs() {
  const tabs = document.getElementById('recTabs');
  if (!tabs) return;
  const cats = Object.keys(priceData);
  if (!recCat || !priceData[recCat]) recCat = cats[0] || '';
  tabs.innerHTML = cats.map(function(c) {
    return `<button type="button" class="rec-tab${c === recCat ? ' active' : ''}" onclick="selectRecCat('${c}')">${c}</button>`;
  }).join('');
}

function selectRecCat(cat) {
  if (!priceData[cat] || cat === recCat) return;
  recCat = cat;
  const tabs = document.getElementById('recTabs');
  if (tabs) {
    tabs.querySelectorAll('.rec-tab').forEach(function(b) {
      b.classList.toggle('active', b.textContent === cat);
    });
    const act = tabs.querySelector('.rec-tab.active');
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  renderRecGrid();
  storeSet('scrap_rec_cat', cat);
}

function renderRecGrid() {
  const grid = document.getElementById('recGrid');
  if (!grid) return;
  if (!recCat || !priceData[recCat]) recCat = Object.keys(priceData)[0] || '';
  const items = priceData[recCat] || {};
  const notes = {};
  for (const [item, info] of Object.entries(REC_PRICES[recCat] || {})) {
    notes[item] = info.note;
  }
  const count = Object.keys(items).length;
  let rowsHtml = '';
  let html = `<div class="rec-card">
    <div class="rec-head"><span class="rec-cat">${recCat}</span><span class="rec-count">${count} 个品类 · 元/公斤</span></div>
    <div class="rec-list">`;
  for (const [item, price] of Object.entries(items)) {
    const buyPrice = (price * recRatio / 100).toFixed(2);
    const note = notes[item] || '';
    rowsHtml += `<div class="rec-row">
      <span class="rec-name"><span class="item-link" onclick="openItemInfo('${recCat}','${item}')">${item}</span>${note ? `<i>${note}</i>` : ''}</span>
      <span class="rec-num"><b>${buyPrice}</b>${buyPrice === Number(price).toFixed(2) ? '' : `<em>市场 ${price}</em>`}</span>
    </div>`;
  }
  html += rowsHtml + '</div></div>';
  grid.innerHTML = html;
  const recTime = document.getElementById('recTimeLabel');
  if (recTime) recTime.textContent = updateTime ? '更新于 ' + fmtTime(updateTime) : '';
}

function renderRatioChips() {
  const box = document.getElementById('ratioChips');
  if (!box) return;
  box.innerHTML = RATIO_PRESETS.map(function(v) {
    return `<button type="button" class="ratio-chip${v === recRatio ? ' active' : ''}" onclick="setRatio(${v})">${v}%</button>`;
  }).join('');
}

function setRatio(v) {
  v = parseInt(v);
  if (isNaN(v)) return;
  recRatio = Math.min(120, Math.max(50, v));
  document.getElementById('recRatio').value = recRatio;
  document.getElementById('recRatioLabel').textContent = recRatio + '%';
  storeSet('scrap_rec_ratio_v2', recRatio.toString());
  renderRatioChips();
  renderRecGrid();
}

function onRatioChange() {
  setRatio(document.getElementById('recRatio').value);
}

function save() {
  storeSet('scrap_prices', JSON.stringify(priceData));
  storeSet('scrap_last_prices', JSON.stringify(lastPrices));
  if (updateTime) storeSet('scrap_update_time', updateTime);
}

// ========== 统计 ==========
// 用本地日期，避免 UTC 导致北京时间早 8 点前就被判为"新的一天"而清零
function todayKey() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + m + '-' + day;
}

// ========== 浏览量统计（不蒜子，按天分桶 + 本地去重） ==========
// 每次打开页面按「/feipinbaojia/day/YYYY-MM-DD」计数，得到今日浏览；
// 同一次请求返回的 site_pv 就是累计浏览。
// 去重：同一浏览器 1 小时内只上报一次，连续刷新不会一次涨一个数；
// 过了这个窗口再打开就会重新拉一次，别人这一小时的访问也能看到。
var PV_THROTTLE_MS = 60 * 60 * 1000;
function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}

let viewToday = null;
let viewTotal = null;

function paintViews() {
  const a = document.getElementById('statToday');
  const b = document.getElementById('statTotal');
  if (a) a.textContent = viewToday == null ? '—' : fmtCount(viewToday);
  if (b) b.textContent = viewTotal == null ? '—' : fmtCount(viewTotal);
  renderStatSummary();
}

function loadViews() {
  const dayKey = todayKey();
  const cachedDay = storeGet('scrap_pv_day');
  const cachedToday = storeGet('scrap_pv_today');
  const cachedTotal = storeGet('scrap_pv_total');
  const lastAt = parseInt(storeGet('scrap_pv_at') || '0', 10);

  // 1 小时窗口内已经上报过：直接用刚才拉到的数字，不再请求（连续刷新不涨数）
  if (cachedDay === dayKey && cachedToday !== null && (Date.now() - lastAt) < PV_THROTTLE_MS) {
    viewToday = parseInt(cachedToday, 10);
    viewTotal = cachedTotal !== null ? parseInt(cachedTotal, 10) : null;
    paintViews();
    return;
  }

  const cb = 'bszCb' + Math.random().toString(36).slice(2);
  const pageId = '/feipinbaojia/day/' + dayKey;
  let done = false;
  let sc = null;

  function finish(data) {
    if (done) return;
    done = true;
    if (data && data.page_pv != null) {
      viewToday = Number(data.page_pv);
      viewTotal = data.site_pv != null ? Number(data.site_pv) : null;
      // 记下这次上报的时间，1 小时内不再重复累加
      storeSet('scrap_pv_at', String(Date.now()));
      storeSet('scrap_pv_day', dayKey);
      storeSet('scrap_pv_today', String(viewToday));
      if (viewTotal != null) storeSet('scrap_pv_total', String(viewTotal));
    } else {
      viewToday = null;
      viewTotal = null;
    }
    paintViews();
    try { delete window[cb]; } catch (e) {}
    if (sc && sc.parentNode) sc.parentNode.removeChild(sc);
  }

  window[cb] = finish;
  sc = document.createElement('script');
  sc.src = 'https://busuanzi.ibruce.info/busuanzi?jsonpCallback=' + cb + '&page_id=' + encodeURIComponent(pageId);
  sc.onerror = function() { finish(null); };
  document.head.appendChild(sc);
  setTimeout(function() { finish(null); }, 12000);
}

// ========== 数据概览：折叠 + 摘要 ==========
function toggleStats(force) {
  const panel = document.getElementById('statPanel');
  if (!panel) return;
  const open = force != null ? force : !panel.classList.contains('open');
  panel.classList.toggle('open', open);
  const bar = document.getElementById('statBar');
  if (bar) bar.setAttribute('aria-expanded', open ? 'true' : 'false');
  storeSet('scrap_stats_open', open ? '1' : '0');
}

function renderStatSummary() {
  const el = document.getElementById('sbSum');
  if (!el) return;
  const cats = Object.keys(priceData || {}).length;
  let items = 0;
  Object.keys(priceData || {}).forEach(function(c) { items += Object.keys(priceData[c]).length; });
  const today = viewToday == null ? '—' : fmtCount(viewToday);
  const total = viewTotal == null ? '—' : fmtCount(viewTotal);
  el.innerHTML = cats + ' 大类 · ' + items + ' 品类 · 今日 <i>' + today + '</i> · 累计 <i>' + total + '</i>';
}

      '<span class="ov-i-price">' + priceData[ovCat][item] + '<em>元/kg</em></span>' +
      '<span class="ov-i-go">›</span></button>';
  }).join('') || '<div style="color:#94a3b8;font-size:.85rem;padding:8px 2px">暂无品类</div>';
}

function updateStats() {
  const cats = Object.keys(priceData);
  let items = 0;
  cats.forEach(c => items += Object.keys(priceData[c]).length);
  document.getElementById('statCats').textContent = cats.length;
  document.getElementById('statItems').textContent = items;
  document.getElementById('updateTimeLabel').textContent = updateTime ? '最后更新: ' + fmtTime(updateTime) : '';
  renderStatSummary();
}

// ========== 下拉框 ==========
function renderCatSelect() {
  const sel = document.getElementById('selCat');
  sel.innerHTML = '<option value="">选择大类</option>';
  Object.keys(priceData).forEach(cat => {
    sel.innerHTML += `<option value="${cat}">${cat}</option>`;
  });
}

function loadItems() {
  const cat = document.getElementById('selCat').value;
  const sel = document.getElementById('selItem');
  sel.innerHTML = '<option value="">选择品类</option>';
  if (!cat || !priceData[cat]) return;
  // 联动下方推荐收货价，切到同一大类
  if (cat !== recCat) {
    recCat = cat;
    renderRecTabs();
    renderRecGrid();
  }
  Object.keys(priceData[cat]).forEach(item => {
    const p = priceData[cat][item];
    sel.innerHTML += `<option value="${item}">${item} - ${p}元/kg</option>`;
  });
}

// ========== 计算 ==========
function calcPrice() {
  const cat = document.getElementById('selCat').value;
  const item = document.getElementById('selItem').value;
  const weight = parseFloat(document.getElementById('inputWeight').value);

  if (!cat || !item) return toast('请选择品类');
  if (!weight || weight <= 0) return toast('请输入有效重量');

  const unitPrice = priceData[cat][item];
  const total = unitPrice * weight;

  document.getElementById('resultPrice').textContent = '¥' + total.toFixed(2);
  document.getElementById('resultDetail').textContent = `${item} × ${weight}kg × ${unitPrice}元/kg`;
  document.getElementById('resultBox').style.display = 'block';

}

// ========== 表格 ==========
function renderTable() {
  const keyword = document.getElementById('searchBox').value.toLowerCase();
  const tbody = document.getElementById('priceBody');
  let html = '';

  Object.keys(priceData).forEach(cat => {
    Object.keys(priceData[cat]).forEach(item => {
      if (keyword && !item.toLowerCase().includes(keyword) && !cat.toLowerCase().includes(keyword)) return;
      const cur = priceData[cat][item];
      const last = lastPrices[cat] ? lastPrices[cat][item] : null;
      let changeHtml = '<span class="flat">-</span>';
      let tagHtml = '';
      if (last !== null && last !== undefined && last !== cur) {
        const pct = ((cur - last) / last * 100).toFixed(1);
        if (cur > last) {
          changeHtml = `<span class="up">↑ ${pct}%</span>`;
          tagHtml = '<span class="tag tag-up">涨</span>';
        } else {
          changeHtml = `<span class="down">↓ ${Math.abs(pct)}%</span>`;
          tagHtml = '<span class="tag tag-down">跌</span>';
        }
      }
      html += `<tr>
        <td data-label="大类">${cat}</td><td data-label="品类"><span class="item-link" onclick="openItemInfo('${cat}','${item}')">${item}</span><span class="info-badge" onclick="openItemInfo('${cat}','${item}')" title="查看介绍与分辨方法">i</span></td><td data-label="单价(元/kg)"><b>${cur}</b></td>
        <td data-label="上次价格">${last !== null && last !== undefined ? last : '-'}</td>
        <td data-label="涨跌">${changeHtml} ${tagHtml}</td>
        <td data-label="详情"><button class="btn btn-info btn-sm" onclick="openItemInfo('${cat}','${item}')">详情</button></td>
      </tr>`;
    });
  });

  tbody.innerHTML = html || '<tr class="empty-row"><td colspan="6">无匹配结果</td></tr>';
}

// ========== 品类详情 ==========
function openItemInfo(cat, item) {
  const info = ITEM_INFO[cat + '|' + item] || {
    intro: '这个品类暂时还没有详细资料，价格以下是当前市场参考价，实际以现场验货为准。',
    how: ['看外观与色泽：同一种料颜色越纯、杂质越少，价格越高。', '动手掂一掂：手感沉、声音脆的一般更实在。', '不确定时分开堆放，别和低价的混在一起过秤。'],
    tip: '收货前建议现场称重并拍照留证，量大时先小批量试价。'
  };
  document.getElementById('infoCat').textContent = cat;
  document.getElementById('infoName').textContent = item;
  document.getElementById('infoPrice').textContent = (priceData[cat] && priceData[cat][item] != null) ? priceData[cat][item] : '-';
  document.getElementById('infoIntro').textContent = info.intro;
  document.getElementById('infoTip').textContent = info.tip;
  const how = document.getElementById('infoHow');
  how.innerHTML = info.how.map(function(x){ return '<li>' + x + '</li>'; }).join('');
  document.getElementById('infoModal').classList.add('show');
  syncScrollLock();
}
function closeItemInfo() {
  document.getElementById('infoModal').classList.remove('show');
  syncScrollLock();
}

// ========== 导出CSV ==========
function exportCSV() {
  let csv = '\uFEFF大类,品类,当前价格(元/kg),上次价格,涨跌幅\n';
  Object.keys(priceData).forEach(cat => {
    Object.keys(priceData[cat]).forEach(item => {
      const cur = priceData[cat][item];
      const last = lastPrices[cat] ? lastPrices[cat][item] : null;
      let pct = '-';
      if (last !== null && last !== undefined && last !== cur) {
        pct = ((cur - last) / last * 100).toFixed(1) + '%';
      }
      csv += `${cat},${item},${cur},${last !== null && last !== undefined ? last : '-'},${pct}\n`;
    });
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `废品回收价格_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('✅ CSV已下载');
}

// ========== 导出Excel ==========
let xlsxLoading = null;
function loadXLSX() {
  if (typeof XLSX !== 'undefined') return Promise.resolve();
  if (xlsxLoading) return xlsxLoading;
  xlsxLoading = new Promise(function(resolve, reject) {
    var sc = document.createElement('script');
    sc.src = 'xlsx.full.min.js';
    sc.onload = function() { resolve(); };
    sc.onerror = function() { xlsxLoading = null; reject(new Error('xlsx load fail')); };
    document.head.appendChild(sc);
  });
  return xlsxLoading;
}

function exportExcel() {
  loadXLSX().then(function() {
    doExportExcel();
  }).catch(function() {
    toast('Excel 库加载失败，请检查网络');
  });
}

function doExportExcel() {
  if (typeof XLSX === 'undefined') return toast('Excel 库加载失败，请检查网络');
  const ratio = recRatio;
  const rows = [['大类', '品类', '当前价格(元/kg)', '上次价格', '涨跌幅', '收货价(元/kg)']];
  Object.keys(priceData).forEach(cat => {
    Object.keys(priceData[cat]).forEach(item => {
      const cur = priceData[cat][item];
      const last = lastPrices[cat] ? lastPrices[cat][item] : null;
      let pct = '-';
      if (last !== null && last !== undefined && last !== cur) {
        pct = ((cur - last) / last * 100).toFixed(1) + '%';
      }
      const buyPrice = (cur * ratio / 100).toFixed(2);
      rows.push([cat, item, cur, last !== null && last !== undefined ? last : '-', pct, parseFloat(buyPrice)]);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 12 }, { wch: 16 }, { wch: 16 }, { wch: 12 }, { wch: 10 }, { wch: 16 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '废品回收报价');
  const date = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, `废品回收报价_${date}.xlsx`);
  toast('✅ Excel已下载');
}

// ========== 工具 ==========
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// 回车计算
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (document.activeElement.id === 'inputWeight')) calcPrice();
});

init();
</script>
